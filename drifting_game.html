<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>لعبة التفحيط في شارع الملك فهد</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255,255,255,0.8);
      padding: 10px;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div id="info">استخدم الأسهم للتحكم بالسيارة</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // إعداد المشهد والكاميرا والمجسمات
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xa0a0a0);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.HemisphereLight(0xffffff, 0x444444);
    light.position.set(0, 20, 0);
    scene.add(light);

    const roadGeometry = new THREE.PlaneGeometry(200, 20);
    const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const road = new THREE.Mesh(roadGeometry, roadMaterial);
    road.rotation.x = -Math.PI / 2;
    scene.add(road);

    const carGeometry = new THREE.BoxGeometry(2, 1, 4);
    const carMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });
    const car = new THREE.Mesh(carGeometry, carMaterial);
    car.position.y = 0.5;
    scene.add(car);

    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    const keys = { ArrowUp:false, ArrowDown:false, ArrowLeft:false, ArrowRight:false };

    function handleKeys(){
      direction.set(0, 0, 0);
      if(keys.ArrowUp) direction.z -= 1;
      if(keys.ArrowDown) direction.z += 1;
      if(keys.ArrowLeft) direction.x -= 1;
      if(keys.ArrowRight) direction.x += 1;
      direction.normalize();
      velocity.add(direction.multiplyScalar(0.05));
      velocity.multiplyScalar(0.98); // احتكاك بسيط لمحاكاة التفحيط
      car.position.add(velocity);
    }

    document.addEventListener('keydown', e => { if(e.code in keys) keys[e.code] = true; });
    document.addEventListener('keyup', e => { if(e.code in keys) keys[e.code] = false; });

    function animate() {
      requestAnimationFrame(animate);
      handleKeys();
      camera.lookAt(car.position);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
